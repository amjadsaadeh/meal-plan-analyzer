title: Meal Plan Analyzer
description: >-
  A Django web application for meal planning and nutritional analysis
  based on the German Bundeslebensmittelschlüssel (BLS) food database.

remote_theme: just-the-docs/just-the-docs@v0.10.0

# Site navigation
nav_external_links:
  - title: GitHub Repository
    url: https://github.com/amjadsaadeh/meal-plan-analyzer
    hide_icon: false

# Color scheme
color_scheme: light

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Footer content
footer_content: "MIT License &nbsp;|&nbsp; Meal Plan Analyzer"

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
