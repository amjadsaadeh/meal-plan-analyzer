<style>

  { id: 2, name: "Adult Male 2500 kcal", protein_min: 56, protein_max: 100, energy_min: 2200, energy_max: 2700 },

const DB_FOODS = [

  { id: 2, name: "Haferflocken", bls: "G401", kcal: 370, source: "bls" },

  { id: 10, name: "Whey Protein Shake", bls: "custom_b2c3", kcal: 380, source: "custom" },

/* ── LOGO SVG (inline carrot) ────────────────────────────── */
const LOGO_SVG = `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g transform="rotate(-40 50 50)"><ellipse cx="50" cy="62" rx="22" ry="30" fill="%23F47B20"/><rect x="44" y="38" width="5" height="20" rx="2" fill="%23fff" opacity="0.35" transform="rotate(-10 46 48)"/><rect x="52" y="44" width="4" height="16" rx="2" fill="%23fff" opacity="0.25" transform="rotate(8 54 52)"/><path d="M42 35 Q50 5 58 35" fill="%2356A330"/><path d="M50 32 Q62 8 68 30" fill="%2356A330"/><path d="M36 38 Q28 12 46 34" fill="%2356A330"/></g></svg>`)}`;

/* ── ICONS ───────────────────────────────────────────────── */
const ArrowLeft = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
  </svg>
);
const Plus = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
);
const Trash = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    <line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>

const Edit = () => (

    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
  </svg>
);
const Save = () => (
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
    <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
  </svg>
);
const Columns = () => (
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <rect x="3" y="3" width="7" height="18"/><rect x="14" y="3" width="7" height="18"/>
  </svg>
);
const LogOut = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
    <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
  </svg>
);
const Search = () => (
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
);

/* ── TOP BAR ─────────────────────────────────────────────── */
const TopBar = ({ screen, onNav }) => {
  const navItems = [
    { key: "list", label: "Plans" },
    { key: "food-db", label: "Food DB" },
    { key: "presets", label: "Presets" },
  ];
  const activeNav = ["list","detail"].includes(screen) ? "list"
    : screen === "food-db" ? "food-db"
    : screen === "presets" ? "presets" : null;

  return (
    <div style={{
      width:"100%", height:"var(--top-bar-height)", padding:"0 2.5%",
      background:"var(--card-bg)", backdropFilter:"blur(12px)",
      borderBottom:"1px solid var(--glass-border)", display:"flex",
      justifyContent:"space-between", alignItems:"center",
      position:"sticky", top:0, zIndex:1000,
      boxShadow:"0 2px 10px rgba(0,0,0,0.02)"
    }}>
      <div style={{display:"flex", alignItems:"center", gap:"20px"}}>
        <div style={{display:"flex", alignItems:"center", gap:"8px", cursor:"pointer"}} onClick={() => onNav("list")}>
          <img src={LOGO_SVG} style={{height:"28px", width:"auto"}} alt="logo" />
          <span style={{fontSize:".9rem", fontWeight:600, color:"var(--text-dim)"}}>
            RSOS Meal Planner <span style={{fontSize:".75rem", fontWeight:400, opacity:.65}}>v1.2</span>
          </span>
        </div>
        {screen !== "login" && (
          <nav style={{display:"flex", gap:"4px"}}>
            {navItems.map(n => (
              <a key={n.key} href="#" onClick={e => { e.preventDefault(); onNav(n.key); }}
                style={{
                  padding:"6px 14px", borderRadius:"8px", fontSize:".88rem", textDecoration:"none",
                  fontWeight: activeNav===n.key ? 600 : 400,
                  color: activeNav===n.key ? "var(--primary-hover)" : "var(--text-dim)",
                  background: activeNav===n.key ? "var(--primary-glow)" : "transparent",
                  transition:"all .15s"
                }}
              >{n.label}</a>
            ))}
          </nav>
        )}
      </div>
      {screen !== "login" && (
        <div style={{display:"flex", alignItems:"center", gap:"1.5rem"}}>
          <div style={{display:"flex", alignItems:"center", gap:"6px", fontSize:".88rem", color:"var(--text-dim)"}}>
            Logged in as <strong style={{color:"var(--primary)", fontWeight:600}}>dr.mueller</strong>
          </div>
          <button onClick={() => onNav("login")} style={{
            background:"transparent", border:"1px solid var(--glass-border)", color:"var(--text-dim)",
            padding:".4rem .85rem", borderRadius:"10px", fontSize:".78rem", cursor:"pointer",
            display:"flex", alignItems:"center", gap:"5px", transition:"all .2s"
          }}>
            <LogOut /> Log out
          </button>
        </div>
      )}
    </div>
  );
};

/* ── LOGIN ───────────────────────────────────────────────── */
const LoginScreen = ({ onLogin }) => {
  const [user, setUser] = useState("dr.mueller");
  const [pass, setPass] = useState("");
  const [err, setErr] = useState("");

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!pass) { setErr("Please enter a password."); return; }
    setErr(""); onLogin();
  };

  return (
    <div style={{display:"flex", alignItems:"center", justifyContent:"center", minHeight:"calc(100vh - var(--top-bar-height))", padding:"2rem"}}>
      <div style={{
        width:"100%", maxWidth:"380px", background:"var(--card-bg)", backdropFilter:"blur(12px)",
        border:"1px solid var(--glass-border)", borderRadius:"20px", padding:"2.5rem",
        boxShadow:"var(--card-shadow)"
      }}>
        <div style={{textAlign:"center", marginBottom:"2rem"}}>
          <img src={LOGO_SVG} style={{height:"48px", marginBottom:"1rem"}} alt="logo" />
          <h1 style={{
            fontSize:"2rem", fontWeight:400,
            background:"var(--gradient-title)", WebkitBackgroundClip:"text",
            backgroundClip:"text", WebkitTextFillColor:"transparent", marginBottom:".4rem"
          }}>Meal Plan Analyzer</h1>
          <p style={{color:"var(--text-dim)", fontSize:".9rem"}}>Professional nutrition analysis</p>
        </div>
        {err && (
          <div style={{background:"rgba(166,65,67,0.1)", borderRadius:"8px", padding:".75rem 1rem",
            color:"var(--danger)", fontSize:".82rem", marginBottom:"1rem"}}>
            {err}
          </div>
        )}
        <form onSubmit={handleSubmit}>
          <div style={{marginBottom:"1.25rem"}}>
            <label style={{display:"block", marginBottom:".45rem", color:"var(--text-dim)", fontSize:".85rem"}}>Username</label>
            <input type="text" value={user} onChange={e => setUser(e.target.value)}
              style={{width:"100%", padding:".75rem 1rem", border:"1px solid var(--glass-border)",
                borderRadius:"12px", fontSize:".95rem", outline:"none", color:"var(--text-main)",
                boxShadow:"var(--shadow)", transition:"all .25s"}}
            />
          </div>
          <div style={{marginBottom:"1.5rem"}}>
            <label style={{display:"block", marginBottom:".45rem", color:"var(--text-dim)", fontSize:".85rem"}}>Password</label>
            <input type="password" value={pass} onChange={e => setPass(e.target.value)}
              placeholder="••••••••"
              style={{width:"100%", padding:".75rem 1rem", border:"1px solid var(--glass-border)",
                borderRadius:"12px", fontSize:".95rem", outline:"none", color:"var(--text-main)",
                boxShadow:"var(--shadow)", transition:"all .25s"}}
            />
          </div>
          <button type="submit" style={{
            width:"100%", padding:".9rem", background:"var(--primary)", color:"white",
            border:"none", borderRadius:"12px", fontSize:"1rem", fontWeight:400, cursor:"pointer",
            boxShadow:"0 4px 10px var(--primary-glow)", transition:"all .25s"
          }}>Log In</button>
        </form>
      </div>
    </div>
  );
};

/* ── MEAL PLAN LIST ──────────────────────────────────────── */
const MealPlanList = ({ onOpen }) => {
  const [search, setSearch] = useState("");
  const [deleteId, setDeleteId] = useState(null);
  const filtered = PLANS.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));

  return (
    <div style={{maxWidth:"900px", margin:"0 auto", padding:"2rem 2.5%"}}>
      <header style={{textAlign:"center", marginBottom:"2.5rem"}}>
        <h1 style={{
          fontSize:"2.5rem", fontWeight:400,
          background:"var(--gradient-title)", WebkitBackgroundClip:"text",
          backgroundClip:"text", WebkitTextFillColor:"transparent", marginBottom:".4rem"
        }}>Meal Plans</h1>
        <p style={{color:"var(--text-dim)", fontSize:".95rem"}}>Manage patient nutrition programs</p>
      </header>

      <div style={{display:"flex", gap:"1rem", marginBottom:"1.5rem", alignItems:"center"}}>
        <button style={{
          display:"inline-flex", alignItems:"center", gap:"7px", padding:".75rem 1.4rem",
          background:"var(--primary)", color:"white", borderRadius:"12px", border:"none",
          fontWeight:400, fontSize:".95rem", cursor:"pointer", whiteSpace:"nowrap",
          boxShadow:"0 4px 10px var(--primary-glow)", transition:"all .25s"
        }}>
          <Plus /> New Plan
        </button>
        <div style={{position:"relative", flexGrow:1}}>
          <div style={{position:"absolute", left:"12px", top:"50%", transform:"translateY(-50%)", color:"var(--text-dim)", pointerEvents:"none"}}>
            <Search />
          </div>
          <input type="text" value={search} onChange={e => setSearch(e.target.value)}
            placeholder="Search plans…"
            style={{width:"100%", padding:".75rem 1rem .75rem 2.5rem", background:"#fff",
              border:"1px solid var(--glass-border)", borderRadius:"12px", fontSize:".95rem",
              outline:"none", color:"var(--text-main)", boxShadow:"var(--shadow)", transition:"all .25s"}}
          />
        </div>
      </div>

      <div style={{
        background:"var(--card-bg)", backdropFilter:"blur(12px)",
        border:"1px solid var(--glass-border)", borderRadius:"20px",
        boxShadow:"var(--card-shadow)", overflow:"hidden"
      }}>
        <table style={{width:"100%", borderCollapse:"collapse", textAlign:"left"}}>
          <thead>
            <tr>
              {["Plan Name","Days","kcal/day","Created","Last Changed",""].map((h,i) => (
                <th key={i} style={{
                  padding:"1rem 1.25rem", fontWeight:600, color:"var(--text-dim)",
                  fontSize:".78rem", textTransform:"uppercase", letterSpacing:".05em",
                  borderBottom:"1px solid var(--glass-border)"
                }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr><td colSpan={6} style={{textAlign:"center", padding:"3rem", color:"var(--text-dim)"}}>No plans found.</td></tr>
            )}
            {filtered.map(p => (
              <tr key={p.id} onClick={() => onOpen(p.id)}
                style={{cursor:"pointer"}}
                onMouseEnter={e => [...e.currentTarget.querySelectorAll("td")].forEach(td => td.style.background="var(--row-hover)")}
                onMouseLeave={e => [...e.currentTarget.querySelectorAll("td")].forEach(td => td.style.background="")}
              >
                <td style={{padding:"1rem 1.25rem", borderBottom:"1px solid var(--glass-border)", fontWeight:400}}>{p.name}</td>
                <td style={{padding:"1rem 1.25rem", borderBottom:"1px solid var(--glass-border)"}}>
                  <span style={{background:"rgba(106,217,198,.1)", color:"#4fada0", borderRadius:"20px", padding:"2px 10px", fontSize:".75rem", fontWeight:600}}>{p.days} days</span>
                </td>
                <td style={{padding:"1rem 1.25rem", borderBottom:"1px solid var(--glass-border)"}}>
                  <span style={{background:"rgba(106,217,198,.1)", padding:"3px 10px", borderRadius:"8px", fontSize:".78rem", color:"#4fada0"}}>{p.kcal.toLocaleString()} kcal</span>
                </td>
                <td style={{padding:"1rem 1.25rem", borderBottom:"1px solid var(--glass-border)", color:"var(--text-dim)", fontSize:".88rem"}}>{p.created}</td>
                <td style={{padding:"1rem 1.25rem", borderBottom:"1px solid var(--glass-border)", color:"var(--text-dim)", fontSize:".88rem"}}>{p.changed}</td>
                <td style={{padding:"1rem 1.25rem", borderBottom:"1px solid var(--glass-border)", textAlign:"center", width:"50px"}}>
                  <button onClick={e => { e.stopPropagation(); setDeleteId(p.id); }}
                    style={{background:"transparent", border:"none", color:"var(--text-dim)", padding:"6px", borderRadius:"8px", cursor:"pointer", display:"inline-flex", alignItems:"center", transition:"all .2s"}}
                    onMouseEnter={e => { e.currentTarget.style.color="var(--danger)"; e.currentTarget.style.background="rgba(166,65,67,0.08)"; }}
                    onMouseLeave={e => { e.currentTarget.style.color="var(--text-dim)"; e.currentTarget.style.background="transparent"; }}
                  ><Trash /></button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        <div style={{display:"flex", justifyContent:"center", gap:".4rem", padding:"1.25rem"}}>
          {[1,2,3].map(p => (
            <a key={p} href="#" onClick={e => e.preventDefault()} style={{
              padding:".4rem .85rem", borderRadius:"8px", textDecoration:"none", fontSize:".85rem",
              background: p===1 ? "var(--primary)" : "transparent",
              color: p===1 ? "white" : "var(--text-dim)",
              border: p===1 ? "none" : "1px solid transparent"
            }}>{p}</a>
          ))}
        </div>
      </div>

      {deleteId && (
        <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.4)", backdropFilter:"blur(4px)",
          display:"flex", alignItems:"center", justifyContent:"center", zIndex:10000}}>
          <div style={{background:"white", padding:"2rem", borderRadius:"20px", width:"380px",
            boxShadow:"0 20px 50px rgba(0,0,0,0.15)", animation:"modalIn .3s cubic-bezier(0.16,1,0.3,1)"}}>
            <h3 style={{fontSize:"1.3rem", fontWeight:600, marginBottom:".75rem", color:"var(--text-main)"}}>Delete Plan?</h3>
            <p style={{color:"var(--text-dim)", fontSize:".9rem", marginBottom:".75rem"}}>
              This will permanently remove <strong style={{color:"var(--text-main)"}}>{PLANS.find(p=>p.id===deleteId)?.name}</strong>.
            </p>

/* ── NUTRIENT TOTALS HELPERS ─────────────────────────────── */
const calcTotal = (foods, meal) => {
  const f = meal ? foods.filter(f => f.meal === meal) : foods;
  return {
    kcal: f.reduce((s, x) => s + x.kcal * x.amount / 100, 0),
    protein: f.reduce((s, x) => s + x.protein * x.amount / 100, 0),
    fat: f.reduce((s, x) => s + x.fat * x.amount / 100, 0),
    carbs: f.reduce((s, x) => s + x.carbs * x.amount / 100, 0),
  };
};

    { key:"vitc_in_mg", label:"Vit. C", unit:"mg" },
    { key:"calcium_in_mg", label:"Calcium", unit:"mg" },
    { key:"vitd_in_mug", label:"Vit. D", unit:"µg" },
  ];

  if (editId) {
    const preset = presets.find(p => p.id === editId) || presets[0];
    return (
      <div style={{maxWidth:"860px", margin:"0 auto", padding:"2rem 2.5%"}}>
        <a href="#" onClick={e => { e.preventDefault(); setEditId(null); }} style={{display:"inline-flex", alignItems:"center", gap:"5px", color:"var(--text-dim)", textDecoration:"none", fontSize:".88rem", marginBottom:"1.5rem", transition:"color .2s"}}
          onMouseEnter={e => e.currentTarget.style.color="var(--primary)"}
          onMouseLeave={e => e.currentTarget.style.color="var(--text-dim)"}
        ><ArrowLeft /> Back to Presets</a>
        <div style={{display:"flex", alignItems:"center", gap:"10px", marginBottom:"2rem"}}>
          <h1 style={{fontSize:"1.8rem", fontWeight:400, background:"var(--gradient-title)", WebkitBackgroundClip:"text", backgroundClip:"text", WebkitTextFillColor:"transparent"}}>{preset.name}</h1>
          <button style={{background:"none", border:"none", cursor:"pointer", color:"var(--text-dim)", padding:"6px", borderRadius:"8px", display:"inline-flex"}}><Edit /></button>
        </div>
        <div style={{background:"var(--card-bg)", border:"1px solid var(--glass-border)", borderRadius:"20px", boxShadow:"var(--card-shadow)", overflow:"hidden"}}>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr"}}>
            {nutRows.map((n, i) => (
              <div key={n.key} style={{padding:".8rem 1.5rem", borderBottom:"1px solid var(--glass-border)", borderRight: i%2===0 ? "1px solid var(--glass-border)" : "none", display:"flex", justifyContent:"space-between", alignItems:"center", gap:"1rem"}}>
                <div>
                  <div style={{fontSize:".9rem", color:"var(--text-main)"}}>{n.label}</div>
                  <div style={{fontSize:".75rem", color:"var(--text-dim)"}}>{n.unit}</div>
                </div>
                <div style={{display:"flex", alignItems:"center", gap:"8px"}}>
                  <span style={{fontSize:".7rem", color:"var(--text-dim)", textTransform:"uppercase", letterSpacing:".05em"}}>min</span>
                  <input type="number" defaultValue={preset[`${n.key.replace("_in_kcal","").replace("_in_g","").replace("_in_mg","").replace("_in_mug","")}_min`] || ""}
                    style={{width:"80px", padding:".35rem .6rem", border:"1px solid var(--glass-border)", borderRadius:"8px", background:"white", color:"var(--text-main)", fontSize:".88rem", outline:"none", textAlign:"center"}}
                  />
                  <span style={{fontSize:".7rem", color:"var(--text-dim)", textTransform:"uppercase", letterSpacing:".05em"}}>max</span>
                  <input type="number" defaultValue={preset[`${n.key.replace("_in_kcal","").replace("_in_g","").replace("_in_mg","").replace("_in_mug","")}_max`] || ""}
                    style={{width:"80px", padding:".35rem .6rem", border:"1px solid var(--glass-border)", borderRadius:"8px", background:"white", color:"var(--text-main)", fontSize:".88rem", outline:"none", textAlign:"center"}}
                  />
                </div>
              </div>
            ))}
          </div>
          <div style={{padding:"1.25rem 1.5rem", borderTop:"1px solid var(--glass-border)"}}>
            <button style={{background:"transparent", border:"1px solid var(--danger)", color:"var(--danger)", padding:".6rem 1.3rem", borderRadius:"10px", cursor:"pointer", fontSize:".88rem", transition:"all .2s"}}
              onMouseEnter={e => { e.currentTarget.style.background="var(--danger)"; e.currentTarget.style.color="white"; }}
              onMouseLeave={e => { e.currentTarget.style.background="transparent"; e.currentTarget.style.color="var(--danger)"; }}
            >Delete Preset</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{maxWidth:"860px", margin:"0 auto", padding:"2rem 2.5%"}}>
      <header style={{marginBottom:"2rem"}}>
        <h1 style={{fontSize:"2rem", fontWeight:400, background:"var(--gradient-title)", WebkitBackgroundClip:"text", backgroundClip:"text", WebkitTextFillColor:"transparent", marginBottom:".4rem"}}>Threshold Presets</h1>
        <p style={{color:"var(--text-dim)", fontSize:".9rem"}}>Reusable nutrient reference templates</p>
      </header>
      <div style={{display:"flex", gap:"1rem", marginBottom:"1.5rem"}}>
        <button style={{display:"inline-flex", alignItems:"center", gap:"7px", padding:".7rem 1.3rem", background:"var(--primary)", color:"white", borderRadius:"12px", border:"none", fontWeight:400, fontSize:".9rem", cursor:"pointer", boxShadow:"0 4px 10px var(--primary-glow)"}}>
          <Plus /> New Preset
        </button>
      </div>
      <div style={{background:"var(--card-bg)", border:"1px solid var(--glass-border)", borderRadius:"20px", boxShadow:"var(--card-shadow)", overflow:"hidden"}}>
        <table style={{width:"100%", borderCollapse:"collapse"}}>
          <thead>
            <tr>
              {["Name","Energy (kcal)","Protein (g)","Actions"].map((h,i) => (
                <th key={i} style={{padding:"1rem 1.25rem", fontWeight:600, color:"var(--text-dim)", fontSize:".78rem", textTransform:"uppercase", letterSpacing:".05em", borderBottom:"1px solid var(--glass-border)", textAlign: i===3 ? "right" : "left"}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {presets.map(p => (
              <tr key={p.id} style={{cursor:"pointer"}}
                onMouseEnter={e => [...e.currentTarget.querySelectorAll("td")].forEach(td => td.style.background="var(--row-hover)")}
                onMouseLeave={e => [...e.currentTarget.querySelectorAll("td")].forEach(td => td.style.background="")}
              >
                <td style={{padding:".9rem 1.25rem", borderBottom:"1px solid var(--glass-border)", fontWeight:400, color:"var(--text-main)"}}>{p.name}</td>
                <td style={{padding:".9rem 1.25rem", borderBottom:"1px solid var(--glass-border)", color:"var(--text-dim)", fontSize:".88rem", fontVariantNumeric:"tabular-nums"}}>
                  {p.energy_min} – {p.energy_max}
                </td>
                <td style={{padding:".9rem 1.25rem", borderBottom:"1px solid var(--glass-border)", color:"var(--text-dim)", fontSize:".88rem", fontVariantNumeric:"tabular-nums"}}>
                  {p.protein_min} – {p.protein_max || "—"}
                </td>
                <td style={{padding:".9rem 1.25rem", borderBottom:"1px solid var(--glass-border)", textAlign:"right"}}>
                  <button onClick={() => setEditId(p.id)} style={{background:"none", border:"none", color:"var(--text-dim)", padding:"5px 8px", borderRadius:"7px", cursor:"pointer", display:"inline-flex", alignItems:"center", gap:"5px", fontSize:".82rem", transition:"all .2s"}}
                    onMouseEnter={e => { e.currentTarget.style.color="var(--primary)"; e.currentTarget.style.background="var(--primary-glow)"; }}
                    onMouseLeave={e => { e.currentTarget.style.color="var(--text-dim)"; e.currentTarget.style.background="transparent"; }}
                  ><Edit /> Edit</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

/* ── APP SHELL ───────────────────────────────────────────── */
const App = () => {
  const [screen, setScreen] = useState("login");
  const [planId, setPlanId] = useState(null);

  const nav = (s) => setScreen(s);
  const openPlan = (id) => { setPlanId(id); setScreen("detail"); };
  const login = () => setScreen("list");

  return (
    <div style={{minHeight:"100vh", display:"flex", flexDirection:"column"}}>
      <TopBar screen={screen} onNav={nav} />
      <div style={{flex:1}}>
        {screen === "login" && <LoginScreen onLogin={login} />}
        {screen === "list" && <MealPlanList onOpen={openPlan} />}
        {screen === "detail" && <MealPlanDetail planId={planId} onBack={() => nav("list")} />}
        {screen === "food-db" && <FoodDatabase />}
        {screen === "presets" && <ThresholdPresets />}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<style>
@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</body>
</html>
