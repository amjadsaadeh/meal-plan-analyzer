<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafc; font-family: system-ui, sans-serif; padding: 20px; }
  .section { margin-bottom: 20px; }
  .label { font-size: 0.62rem; text-transform: uppercase; letter-spacing:.09em; color: #666E73; margin-bottom: 10px; font-weight: 600; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* Energy badge */
  .energy-badge { background: rgba(106,217,198,0.1); padding: 4px 10px; border-radius: 8px; font-size:.78rem; color:#4fada0; white-space:nowrap; font-weight:400; }
  .energy-badge:hover { background:#6AD9C6;color:white;cursor:pointer; }

  /* Alias badge */
  .alias-badge { display:inline-flex;align-items:center;background:rgba(106,217,198,0.15);color:#4180A6;border:1px solid rgba(106,217,198,.45);border-radius:4px;font-size:.68rem;padding:1px 6px;font-weight:400;white-space:nowrap; }

  /* Source badge */
  .badge-bls { display:inline-block;padding:4px 12px;border-radius:8px;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:rgba(102,110,115,.12);color:#666E73; }
  .badge-custom { display:inline-block;padding:4px 12px;border-radius:8px;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:rgba(106,217,198,.2);color:#4fada0; }

  /* Status / sync indicators */
  .status-saved { display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:#41A66D; }
  .status-pending { display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:#666E73; }
  .status-error { display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:#A64143; }

  /* Pagination */
  .page-link { padding:.45rem .9rem;border-radius:8px;text-decoration:none;color:#666E73;transition:all .2s;border:1px solid transparent;font-size:.88rem; }
  .page-link:hover { background:rgba(0,0,0,.04);color:#2c3338; }
  .page-link.active { background:#6AD9C6;color:white;font-weight:400; }
  .page-link.disabled { opacity:.3;pointer-events:none; }

  /* Day badge */
  .day-badge { background:rgba(106,217,198,.1);color:#4fada0;border-radius:20px;padding:2px 10px;font-size:.75rem;font-weight:600; }

  /* BLS code */
  .bls-code { color:#666E73;font-size:.78rem;margin-left:8px;font-weight:300; }

  /* Autosave indicator */
  .autosave { padding:5px 14px;border-radius:20px;font-size:.82rem;font-weight:500; }
  .autosave-saved { background:rgba(65,166,109,.15);color:#41A66D; }
  .autosave-saving { background:rgba(0,0,0,.06);color:#666E73; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Energy &amp; Alias Badges</div>
    <div class="row">
      <span class="energy-badge">2 458 kcal</span>
      <span class="energy-badge">342 kcal</span>
      <span class="alias-badge">alias: Oatmeal</span>
    </div>
  </div>
  <div class="section">
    <div class="label">Data Source Badges</div>
    <div class="row">
      <span class="badge-bls">BLS</span>
      <span class="badge-custom">Custom</span>
    </div>
  </div>
  <div class="section">
    <div class="label">Sync Status</div>
    <div class="row" style="gap:16px">
      <span class="status-saved">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Saved
      </span>
      <span class="status-pending">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Saving…
      </span>
      <span class="status-error">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Error
      </span>
    </div>
  </div>
  <div class="section">
    <div class="label">Day Badge &amp; BLS Code</div>
    <div class="row">
      <span class="day-badge">3 days</span>
      <span>Vollmilch 3,5% Fett<span class="bls-code">M112</span></span>
    </div>
  </div>
  <div class="section">
    <div class="label">Pagination</div>
    <div class="row">
      <a class="page-link disabled" href="#">‹</a>
      <a class="page-link active" href="#">1</a>
      <a class="page-link" href="#">2</a>
      <a class="page-link" href="#">3</a>
      <a class="page-link" href="#">›</a>
    </div>
  </div>
  <div class="section">
    <div class="label">Autosave Indicator</div>
    <div class="row">
      <span class="autosave autosave-saved">✓ Saved</span>
      <span class="autosave autosave-saving">Saving…</span>
    </div>
  </div>
</body>
</html>
