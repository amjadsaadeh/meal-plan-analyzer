[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = "v(?P<version>.*)"
fallback-version = "0.0.0.dev"

[tool.hatch.build.targets.wheel]
packages = ["config", "meals"]

[project]
name = "meal-plan-analyzer"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.6",
    "djangorestframework>=3.16.1",
    "openpyxl>=3.1.5",
    "tqdm>=4.67.1",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.3",
    "whitenoise>=6.8.2",
    "django-environ>=0.11.2",
    "weasyprint>=68.0",
    "jsonschema>=4.26.0",
    "playwright==1.56.0",
    "pillow>=12.2.0",
    "fonttools>=4.63.0",
    "django-sass-processor>=1.4.2",
    "libsass>=0.23.0",
    "django-vite>=3.1.0",
    "celery[redis]>=5.4",
]

[dependency-groups]
dev = [
    "ansible>=13.2.0",
    "black>=26.3.0",
    "factory-boy>=3.3.3",
    "kubernetes>=34.1.0",
    "nc-dnsapi>=0.1.5",
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
    "pytest-playwright>=0.7.2",
]

[tool.black]
line-length = 88
target-version = ["py312"]
