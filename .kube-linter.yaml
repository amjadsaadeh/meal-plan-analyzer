checks:
  addAllBuiltIn: true
  exclude:
    # Init containers write to shared emptyDir volumes (SCSS compilation, collectstatic).
    # A read-only root filesystem is therefore not enforced here.
    - "no-read-only-root-fs"
    # Security hardening (runAsNonRoot, dropping NET_RAW, allowPrivilegeEscalation)
    # is deferred; the base image does not yet configure a non-root user.
    - "run-as-non-root"
    - "drop-net-raw-capability"
    - "privilege-escalation-container"
    # CPU and memory resource requests/limits are not yet tuned for all containers
    # (Celery worker sidecar, init containers, Redis); deferred for a dedicated
    # resource-configuration pass.
    - "unset-cpu-requirements"
    - "unset-memory-requirements"
