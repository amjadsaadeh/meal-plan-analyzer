apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meal-planner-ingress
  namespace: meal-planner
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns-issuer
spec:
  tls:
    - hosts:
        - mealplanner.your-domain.example.com
      secretName: meal-planner-tls
  rules:
    - host: mealplanner.your-domain.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meal-planner-service
                port:
                  number: 80
