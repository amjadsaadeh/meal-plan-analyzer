name: Security Audit

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Export requirements
        run: uv export --frozen --no-dev --no-emit-project > requirements-audit.txt

      - name: Run pip-audit
        run: |
          uv tool run pip-audit \
            --requirement requirements-audit.txt \
            --format cyclonedx-json \
            --output python-sbom.json \
            --no-deps || true
          uv tool run pip-audit \
            --requirement requirements-audit.txt \
            --format json \
            --output python-audit.json \
            --no-deps || true

      - name: Fail on vulnerabilities
        run: |
          python3 -c "
          import json, sys
          try:
              data = json.load(open('python-audit.json'))
              vulns = data.get('vulnerabilities', [])
              if vulns:
                  print(f'Found {len(vulns)} vulnerable package(s):', file=sys.stderr)
                  for v in vulns:
                      aliases = v.get('vulns', [{}])[0].get('aliases', []) if v.get('vulns') else []
                      print(f'  - {v[\"name\"]} {v[\"version\"]}: {aliases}', file=sys.stderr)
                  sys.exit(1)
          except FileNotFoundError:
              print('python-audit.json not found — pip-audit may have failed to run', file=sys.stderr)
              sys.exit(1)
          "

      - name: Upload Python audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-audit-report
          path: |
            python-audit.json
            python-sbom.json
          retention-days: 90

      - name: Summarize Python audit results
        if: always()
        run: |
          echo "## Python Dependency Audit" >> $GITHUB_STEP_SUMMARY
          if [ -f python-audit.json ]; then
            VULN_COUNT=$(python3 -c "
          import json, sys
          data = json.load(open('python-audit.json'))
          vulns = data.get('vulnerabilities', [])
          print(len(vulns))
          ")
            if [ "$VULN_COUNT" = "0" ]; then
              echo "✅ No vulnerabilities found in Python dependencies." >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **$VULN_COUNT vulnerability/vulnerabilities found** in Python dependencies." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              python3 -c "
          import json
          data = json.load(open('python-audit.json'))
          for v in data.get('vulnerabilities', []):
              print(f\"| {v.get('name','?')} {v.get('version','?')} | {', '.join(v.get('vulns',[{}])[0].get('aliases',['?']) if v.get('vulns') else ['?'])} | {v.get('vulns',[{}])[0].get('description','')[:120] if v.get('vulns') else ''} |\")
          " >> $GITHUB_STEP_SUMMARY || true
            fi
          fi

  safety-scan:
    name: Safety Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Export requirements
        run: uv export --frozen --no-dev --no-emit-project > requirements-audit.txt

      - name: Run safety check
        run: |
          # Use --output json and extract only the JSON block (deprecation warnings go to stdout too)
          uv tool run safety check --file requirements-audit.txt --output json 2>/dev/null | awk '/^{/,/^}$/' > safety-report.json || true

      - name: Fail on vulnerabilities
        run: |
          python3 -c "
          import json, sys
          try:
              with open('safety-report.json', 'r') as f:
                  data = json.load(f)
              # Safety CLI v3 output format
              vulns = data.get('vulnerabilities', [])
              affected = data.get('affected_packages', {})
              total_vulns = len(vulns)
              total_affected = len(affected)
              if total_vulns > 0:
                  print(f'Found {total_vulns} vulnerability/vulnerabilities in {total_affected} package(s)', file=sys.stderr)
                  sys.exit(1)
          except FileNotFoundError:
              print('safety-report.json not found — safety may have failed to run', file=sys.stderr)
              sys.exit(1)
          except json.JSONDecodeError as e:
              print(f'safety-report.json contains invalid JSON: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Upload Safety report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-report
          path: safety-report.json
          retention-days: 90

      - name: Summarize Safety results
        if: always()
        run: |
          echo "## Safety Dependency Scan" >> $GITHUB_STEP_SUMMARY
          if [ -f safety-report.json ]; then
            VULN_COUNT=$(python3 -c "
          import json
          try:
              with open('safety-report.json', 'r') as f:
                  data = json.load(f)
              vulns = data.get('vulnerabilities', [])
              print(len(vulns))
          except:
              print(0)
          ")
            if [ "$VULN_COUNT" = "0" ]; then
              echo "✅ No vulnerabilities found by Safety." >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **$VULN_COUNT vulnerability/vulnerabilities found** by Safety." >> $GITHUB_STEP_SUMMARY
            fi
          fi

  bandit-scan:
    name: Bandit Code Security Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run bandit
        run: |
          uv tool run bandit -r config/ meals/ manage.py -f json -o bandit-report.json || true

      - name: Fail on high/critical issues
        run: |
          python3 -c "
          import json, sys
          try:
              with open('bandit-report.json', 'r') as f:
                  data = json.load(f)
              results = data.get('results', [])
              severity_counts = {'HIGH': 0, 'CRITICAL': 0}
              for r in results:
                  sev = r.get('issue_severity', '').upper()
                  if sev in severity_counts:
                      severity_counts[sev] += 1
              total = severity_counts['HIGH'] + severity_counts['CRITICAL']
              if total > 0:
                  print(f'Found {total} high/critical issue(s):', file=sys.stderr)
                  for r in results:
                      sev = r.get('issue_severity', '').upper()
                      if sev in ('HIGH', 'CRITICAL'):
                          print(f'  - {sev}: {r.get(\"issue_text\", \"?\")} in {r.get(\"filename\", \"?\")}:{r.get(\"line_number\", \"?\")}', file=sys.stderr)
                  sys.exit(1)
          except FileNotFoundError:
              print('bandit-report.json not found — bandit may have failed to run', file=sys.stderr)
              sys.exit(1)
          "

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 90

      - name: Summarize Bandit results
        if: always()
        run: |
          echo "## Bandit Code Security Linting" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-report.json ]; then
            python3 -c "
          import json
          try:
              with open('bandit-report.json', 'r') as f:
                  data = json.load(f)
              results = data.get('results', [])
              severity_counts = {'LOW': 0, 'MEDIUM': 0, 'HIGH': 0, 'CRITICAL': 0}
              for r in results:
                  sev = r.get('issue_severity', 'UNKNOWN').upper()
                  if sev in severity_counts:
                      severity_counts[sev] += 1
              total = len(results)
              if total == 0:
                  print('✅ No security issues found by Bandit.')
              else:
                  print(f'⚠️ **{total} security issue(s) found** by Bandit:')
                  for sev, count in [('CRITICAL', severity_counts['CRITICAL']), ('HIGH', severity_counts['HIGH']), ('MEDIUM', severity_counts['MEDIUM']), ('LOW', severity_counts['LOW'])]:
                      if count > 0:
                          emoji = '🔴' if sev in ('CRITICAL', 'HIGH') else '🟡'
                          print(f'  - {emoji} {sev}: {count}')
          except Exception as e:
              print(f'Could not parse bandit report: {e}')
          " >> $GITHUB_STEP_SUMMARY
          fi

  trivy-scan:
    name: Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t meal-plan-analyzer:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: "meal-plan-analyzer:scan"
          format: "json"
          output: "trivy-report.json"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: "os,library"
          skip-dirs: "/app/.venv"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 90

      - name: Summarize Trivy results
        if: always()
        run: |
          echo "## Trivy Container Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-report.json ]; then
            python3 -c "
          import json
          try:
              with open('trivy-report.json', 'r') as f:
                  data = json.load(f)
              results = data.get('Results', [])
              if results:
                  vulns = results[0].get('Vulnerabilities', [])
                  severity_counts = {}
                  for v in vulns:
                      sev = v.get('Severity', 'UNKNOWN')
                      severity_counts[sev] = severity_counts.get(sev, 0) + 1
                  total = len(vulns)
                  if total == 0:
                      print('✅ No vulnerabilities found by Trivy.')
                  else:
                      print(f'⚠️ **{total} vulnerability/vulnerabilities found** by Trivy:')
                      for sev, count in sorted(severity_counts.items(), key=lambda x: ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'UNKNOWN'].index(x[0]) if x[0] in ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'UNKNOWN'] else 99):
                          emoji = '🔴' if sev in ('CRITICAL', 'HIGH') else '🟡'
                          print(f'  - {emoji} {sev}: {count}')
              else:
                  print('✅ No vulnerabilities found by Trivy.')
          except Exception as e:
              print(f'Could not parse trivy report: {e}')
          " >> $GITHUB_STEP_SUMMARY
          fi

  js-audit:
    name: JavaScript Dependency Audit (pnpm)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate package-lock.json for audit
        run: npm install --package-lock-only --ignore-scripts

      - name: Run npm audit
        id: pnpm_audit
        run: |
          npm audit --json > js-audit.json 2>&1 || true
          npm audit 2>&1 | tee js-audit.txt || true

      - name: Upload JS audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-audit-report
          path: |
            js-audit.json
            js-audit.txt
          retention-days: 90

      - name: Fail on high/critical JS vulnerabilities
        run: |
          npm audit --audit-level high

      - name: Summarize JS audit results
        if: always()
        run: |
          echo "## JavaScript Dependency Audit" >> $GITHUB_STEP_SUMMARY
          if [ -f js-audit.json ]; then
            python3 -c "
          import json, sys
          try:
              data = json.load(open('js-audit.json'))
              meta = data.get('metadata', {})
              vulns = meta.get('vulnerabilities', {})
              total = sum(vulns.values()) if isinstance(vulns, dict) else 0
              if total == 0:
                  print('✅ No vulnerabilities found in JavaScript dependencies.')
              else:
                  print(f'⚠️ **{total} vulnerability/vulnerabilities found** in JavaScript dependencies.')
                  for sev, count in vulns.items():
                      if count:
                          emoji = '🔴' if sev in ('high','critical') else '🟡'
                          print(f'- {emoji} {sev}: {count}')
          except Exception as e:
              print(f'Could not parse audit JSON: {e}')
          " >> $GITHUB_STEP_SUMMARY || cat js-audit.txt >> $GITHUB_STEP_SUMMARY
          fi

  security-summary:
    name: Security Audit Summary
    runs-on: ubuntu-latest
    needs: [python-audit, safety-scan, bandit-scan, trivy-scan, js-audit]
    if: always()

    steps:
      - name: Write summary
        run: |
          echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python dependencies (pip-audit) | ${{ needs.python-audit.result == 'success' && '✅ passed' || needs.python-audit.result == 'skipped' && '⏭️ skipped' || '❌ failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python dependencies (safety) | ${{ needs.safety-scan.result == 'success' && '✅ passed' || needs.safety-scan.result == 'skipped' && '⏭️ skipped' || '❌ failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python code (bandit) | ${{ needs.bandit-scan.result == 'success' && '✅ passed' || needs.bandit-scan.result == 'skipped' && '⏭️ skipped' || '❌ failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container image (trivy) | ${{ needs.trivy-scan.result == 'success' && '✅ passed' || needs.trivy-scan.result == 'skipped' && '⏭️ skipped' || '❌ failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript dependencies (pnpm audit) | ${{ needs.js-audit.result == 'success' && '✅ passed' || needs.js-audit.result == 'skipped' && '⏭️ skipped' || '❌ failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Full audit reports are available as workflow artifacts (retained 90 days)." >> $GITHUB_STEP_SUMMARY
