name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-secret-key-not-used-in-production
      DATABASE_URL: sqlite:///test-db.sqlite3
      DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 \
            libpango-1.0-0 \
            libharfbuzz0b \
            libpangoft2-1.0-0 \
            libpangocairo-1.0-0 \
            libcairo2 \
            libgdk-pixbuf2.0-0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run API tests
        run: uv run pytest tests/api/ --create-db

  frontend-tests:
    name: Frontend Tests (Playwright)
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-secret-key-not-used-in-production
      DATABASE_URL: sqlite:///test-db.sqlite3
      DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 \
            libpango-1.0-0 \
            libharfbuzz0b \
            libpangoft2-1.0-0 \
            libpangocairo-1.0-0 \
            libcairo2 \
            libgdk-pixbuf2.0-0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run frontend tests
        run: uv run pytest tests/frontend/ --create-db
