name: Deploy to Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy (dev)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: amjadsaadeh/meal-plan-analyzer:dev
          build-args: |
            APP_VERSION=dev-${{ github.ref_name }}-${{ github.sha | truncate(5) }}

      - name: Set up kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create Docker registry secret
        run: |
          kubectl create secret docker-registry regcred \
            -n meal-plan-analyzer-dev \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-password=${{ secrets.DOCKERHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: kubectl apply -k deployment/app-deployment/k8s/overlays/dev/

      - name: Restart deployment
        run: kubectl rollout restart deployment/meal-plan-analyzer -n meal-plan-analyzer-dev
