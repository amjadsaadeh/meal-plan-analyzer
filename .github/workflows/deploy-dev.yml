name: Deploy to Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy (dev)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: amjadsaadeh/meal-plan-analyzer:dev
          build-args: |
            APP_VERSION=dev-${{ github.ref_name }}-${{ steps.vars.outputs.sha_short }}

      - name: Set up kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create Docker registry secret
        run: |
          kubectl create secret docker-registry regcred \
            -n meal-plan-analyzer-dev \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-password=${{ secrets.DOCKERHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: kubectl apply -k deployment/app-deployment/k8s/overlays/dev/

      - name: Restart deployment
        run: kubectl rollout restart deployment/meal-plan-analyzer -n meal-plan-analyzer-dev

      - name: Notify success
        if: success()
        continue-on-error: true
        run: |
          curl -s -o /dev/null \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Title: Deployment succeeded" \
            -H "Tags: white_check_mark" \
            -d "meal-plan-analyzer dev-${{ steps.vars.outputs.sha_short }} deployed successfully to dev." \
            "${{ secrets.NTFY_URL }}"

      - name: Notify failure
        if: failure()
        run: |
          curl -s -o /dev/null \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Title: Deployment FAILED" \
            -H "Tags: x,rotating_light" \
            -H "Priority: high" \
            -d "meal-plan-analyzer dev deployment failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ secrets.NTFY_URL }}"
