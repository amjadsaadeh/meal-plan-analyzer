name: Deploy Dev

on:
  issue_comment:
    types: [created]

jobs:
  deploy:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Check maintainer permission
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.actor;
            const { data: permissions } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter
            });
            if (!['write', 'admin', 'maintain'].includes(permissions.permission)) {
              core.setFailed('Only maintainers can trigger deployments');
            }

      - name: Get PR data
        uses: actions/github-script@v7
        id: pr-data
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return { ref: pr.head.ref, sha: pr.head.sha };

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(steps.pr-data.outputs.result).sha }}

      - name: Sanitize branch name
        id: branch
        run: |
          BRANCH="${{ fromJson(steps.pr-data.outputs.result).ref }}"
          SANITIZED=$(echo "$BRANCH" | sed 's/[^a-z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "name=$SANITIZED" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible kubernetes-core community-docker

      - name: Deploy
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          TLD: ${{ secrets.TLD }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          echo "$ANSIBLE_VAULT_PASSWORD" > vault_pass.txt
          ansible-playbook ansible/deploy-dev.yml \
            -e "branch=${{ steps.branch.outputs.name }}" \
            --vault-password-file vault_pass.txt

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Deployed to https://${{ steps.branch.outputs.name }}.mealplanalyzer-dev.${{ secrets.TLD }}'
            });

  teardown:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/teardown')
    runs-on: ubuntu-latest
    steps:
      - name: Check maintainer permission
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.actor;
            const { data: permissions } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter
            });
            if (!['write', 'admin', 'maintain'].includes(permissions.permission)) {
              core.setFailed('Only maintainers can trigger teardown');
            }

      - name: Get PR data
        uses: actions/github-script@v7
        id: pr-data
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return { ref: pr.head.ref };

      - name: Sanitize branch name
        id: branch
        run: |
          BRANCH="${{ fromJson(steps.pr-data.outputs.result).ref }}"
          SANITIZED=$(echo "$BRANCH" | sed 's/[^a-z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "name=$SANITIZED" >> $GITHUB_OUTPUT
          echo "namespace=meal-plan-analyzer-$SANITIZED" >> $GITHUB_OUTPUT

      - name: Delete namespace
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          kubectl delete namespace ${{ steps.branch.outputs.namespace }} --ignore-not-found=true

      - name: Comment confirmation
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Tear down complete for https://${{ steps.branch.outputs.name }}.mealplanalyzer-dev.${{ secrets.TLD }}'
            });
