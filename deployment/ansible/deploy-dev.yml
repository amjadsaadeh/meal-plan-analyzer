---
- name: Deploy Dev Environment
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  vars:
    image_name: "{{ lookup('env', 'DOCKER_IMAGE') }}"
    project_root: "../../"
    branch: ""
    namespace: "meal-plan-analyzer-{{ branch | regex_replace('[^a-z0-9-]', '-') | lower }}"
    secret_key: "{{ lookup('env', 'DEV_SECRET_KEY') }}"
    db_password: "{{ lookup('env', 'DEV_DB_PASSWORD') }}"
    database_url: "postgresql://meal_plan_analyzer_dev:{{ db_password }}@pgcluster-rw.cloudnative-pg.svc.cluster.local:5432/meal_plan_analyzer_dev"

  tasks:
    - name: Fail if branch not provided
      fail:
        msg: "Please provide 'branch' via -e 'branch=feature-x'"
      when: branch == ""

    - name: Build Docker image
      community.docker.docker_image_build:
        path: "{{ project_root }}"
        name: "{{ image_name }}"
        tag: "{{ branch }}-dev"
        rebuild: "always"
        outputs:
          - type: "docker"
            name: "{{ image_name }}:{{ branch }}-dev"
            push: true

    - name: Create namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ namespace }}"

    - name: Create Docker Registry Secret
      shell: >
        kubectl create secret docker-registry regcred -n {{ namespace }}
        --docker-server=https://index.docker.io/v1/
        --docker-username={{ lookup('env', 'DOCKER_USER') }}
        --docker-password={{ lookup('env', 'DOCKER_PASSWORD') }}
        --dry-run=client -o yaml | kubectl apply -f -

    - name: Apply dev overlay with branch-specific namespace
      shell: |
        cd ../../k8s/overlays/dev
        kustomize edit set namespace {{ namespace }}
        kubectl apply -k .

    - name: Restart Deployment
      shell: kubectl rollout restart deployment/meal-plan-analyzer -n {{ namespace }}

    - name: Get deployment URL
      debug:
        msg: "Deployed to https://{{ branch | regex_replace('[^a-z0-9-]', '-') | lower }}.mealplanalyzer-dev.{{ tld }}"
