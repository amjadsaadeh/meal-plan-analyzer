apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meal-plan-analyzer-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns-issuer
spec:
  tls:
    - hosts:
        - mealplananalyzer.saadeh.dev
      secretName: meal-plan-analyzer-tls
  rules:
    - host: mealplananalyzer.saadeh.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meal-plan-analyzer-service
                port:
                  number: 80
