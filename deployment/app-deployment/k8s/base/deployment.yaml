apiVersion: apps/v1
kind: Deployment
metadata:
  name: meal-plan-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meal-plan-analyzer
  template:
    metadata:
      labels:
        app: meal-plan-analyzer
    spec:
      imagePullSecrets:
        - name: regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: build-scss
          image: image_name
          imagePullPolicy: Always
          command: ["python", "manage.py", "build_scss"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: meal-plan-analyzer-config
            - secretRef:
                name: meal-plan-analyzer-secret
          volumeMounts:
            - name: sass-cache
              mountPath: /app/sass_cache
            - name: tmp
              mountPath: /tmp
        - name: collect-static
          image: image_name
          imagePullPolicy: Always
          command: ["python", "manage.py", "collectstatic", "--noinput"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: meal-plan-analyzer-config
            - secretRef:
                name: meal-plan-analyzer-secret
          volumeMounts:
            - name: staticfiles
              mountPath: /app/staticfiles
            - name: sass-cache
              mountPath: /app/sass_cache
            - name: tmp
              mountPath: /tmp
        - name: migrate
          image: image_name
          imagePullPolicy: Always
          command: ["python", "manage.py", "migrate"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meal-plan-analyzer-db-credentials
                  key: uri
                  optional: true
          envFrom:
            - configMapRef:
                name: meal-plan-analyzer-config
            - secretRef:
                name: meal-plan-analyzer-secret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: create-superuser
          image: image_name
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              python manage.py shell -c "
              from django.contrib.auth import get_user_model
              import os
              User = get_user_model()
              u = os.environ['DJANGO_SUPERUSER_USERNAME']
              if not User.objects.filter(username=u).exists():
                  User.objects.create_superuser(u, '', os.environ['DJANGO_SUPERUSER_PASSWORD'])
                  print('Superuser created.')
              else:
                  print('Superuser already exists, skipping.')
              "
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meal-plan-analyzer-db-credentials
                  key: uri
                  optional: true
          envFrom:
            - configMapRef:
                name: meal-plan-analyzer-config
            - secretRef:
                name: meal-plan-analyzer-secret
            - secretRef:
                name: meal-plan-analyzer-superuser-secret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: import-foods
          image: image_name
          imagePullPolicy: Always
          command: ["python", "manage.py", "import_foods", "https://blsdb.de/assets/uploads/BLS_4_0_2025_DE.zip"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meal-plan-analyzer-db-credentials
                  key: uri
                  optional: true
          envFrom:
            - configMapRef:
                name: meal-plan-analyzer-config
            - secretRef:
                name: meal-plan-analyzer-secret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: meal-plan-analyzer
          image: image_name
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meal-plan-analyzer-db-credentials
                  key: uri
                  optional: true
          envFrom:
            - configMapRef:
                name: meal-plan-analyzer-config
            - secretRef:
                name: meal-plan-analyzer-secret
          volumeMounts:
            - name: staticfiles
              mountPath: /app/staticfiles
            - name: media
              mountPath: /app/media
            - name: private-exports
              mountPath: /app/private_exports
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: worker
          image: image_name
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - config
            - worker
            - --loglevel=info
            - --concurrency=2
            - --max-tasks-per-child=50
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meal-plan-analyzer-db-credentials
                  key: uri
                  optional: true
          envFrom:
            - configMapRef:
                name: meal-plan-analyzer-config
            - secretRef:
                name: meal-plan-analyzer-secret
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "celery -A config inspect ping -d celery@$HOSTNAME -t 5"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: staticfiles
              mountPath: /app/staticfiles
            - name: media
              mountPath: /app/media
            - name: private-exports
              mountPath: /app/private_exports
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: staticfiles
          emptyDir: {}
        - name: sass-cache
          emptyDir: {}
        - name: media
          persistentVolumeClaim:
            claimName: meal-plan-analyzer-media-pvc
        - name: private-exports
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
