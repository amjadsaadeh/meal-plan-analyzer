---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: meal-plan-analyzer-dev
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: meal-plan-analyzer-dev
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: meal-plan-analyzer-dev
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: meal-plan-analyzer-dev
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: meal-plan-analyzer-dev
roleRef:
  kind: Role
  name: ci-deployer
  apiGroup: rbac.authorization.k8s.io
