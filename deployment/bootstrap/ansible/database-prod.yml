---
    - name: Fetch meal_plan_analyzer_prod database user existance
      ansible.builtin.shell:
        cmd: |
          echo "SELECT 1 FROM pg_authid WHERE rolname='meal_plan_analyzer_prod';" | kubectl cnpg -n cloudnative-pg psql pgcluster
      register: psql_meal_plan_analyzer_prod_user_exist_result
      changed_when: psql_meal_plan_analyzer_prod_user_exist_result.rc == 0

    - name: Set user existance fact
      ansible.builtin.set_fact:
        psql_meal_plan_analyzer_prod_user_exist: "{{ psql_meal_plan_analyzer_prod_user_exist_result.stdout_lines | length > 3 }}"

    - name: Create prod database user
      ansible.builtin.shell:
        cmd: |
          echo "CREATE USER meal_plan_analyzer_prod WITH PASSWORD '{{ db_password }}';" | kubectl cnpg -n cloudnative-pg psql pgcluster
      register: psql_prod_user_creation_result
      when: not psql_meal_plan_analyzer_prod_user_exist
      changed_when: psql_prod_user_creation_result.rc == 0

    - name: Fetch meal_plan_analyzer_prod database existance
      ansible.builtin.shell:
        cmd: |
          echo "SELECT 1 FROM pg_database WHERE datname='meal_plan_analyzer_prod';" | kubectl cnpg -n cloudnative-pg psql pgcluster
      register: psql_meal_plan_analyzer_prod_database_exist_result
      changed_when: psql_meal_plan_analyzer_prod_database_exist_result.rc == 0

    - name: Set database existance fact
      ansible.builtin.set_fact:
        psql_meal_plan_analyzer_prod_database_exist: "{{ psql_meal_plan_analyzer_prod_database_exist_result.stdout_lines | length > 3 }}"

    - name: Create prod database
      ansible.builtin.shell:
        cmd: |
          echo "CREATE DATABASE meal_plan_analyzer_prod WITH OWNER meal_plan_analyzer_prod;" | kubectl cnpg -n cloudnative-pg psql pgcluster
      register: psql_prod_database_creation_result
      when: not psql_meal_plan_analyzer_prod_database_exist
      changed_when: psql_prod_database_creation_result.rc == 0
