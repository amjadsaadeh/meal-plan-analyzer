# Bootstrap variables
# Set env to 'prod' or 'dev' to bootstrap specific environment
# Leave empty to bootstrap both
env: ""

# Database connection — used by prod only.
# Dev uses the CNPG-managed service endpoint (meal-plan-analyzer-db-rw).
db_host: "pgcluster-rw.cloudnative-pg.svc.cluster.local"
db_port: "5432"

# K8s namespace
dev_namespace: "meal-plan-analyzer-dev"
