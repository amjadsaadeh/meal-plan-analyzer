apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: meal-plan-analyzer-dev

resources:
  - namespace.yaml
  - ../../base

secretGenerator:
  - name: meal-plan-analyzer-secret
    envs:
      - secrets.env
  - name: meal-plan-analyzer-db-credentials
    envs:
      - cnpg-credentials.env
  - name: meal-plan-analyzer-superuser-secret
    envs:
      - superuser-credentials.env

generatorOptions:
  disableNameSuffixHash: true
