apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-cluster-manager
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer-cnpg-cluster-manager
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: meal-plan-analyzer-dev
roleRef:
  kind: Role
  name: cnpg-cluster-manager
  apiGroup: rbac.authorization.k8s.io
